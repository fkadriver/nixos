[global]
   workgroup = WORKGROUP
   server string = nas01
   server role = standalone server

   # Security
   security = user
   map to guest = never
   # Restrict to local network - adjust to match your subnet
   hosts allow = 192.168.1.0/24 127.0.0.1
   hosts deny = ALL

   # Logging
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # Performance
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   read raw = yes
   write raw = yes
   use sendfile = yes
   aio read size = 0
   aio write size = 0

   # mDNS/Avahi for auto-discovery
   multicast dns register = yes

# Main NAS data share
# TODO: Adjust path to match ZFS dataset mountpoint (e.g. /pool/data or /pool/media)
[data]
   comment = NAS Data
   path = /pool/data
   valid users = scott
   read only = no
   browsable = yes
   create mask = 0664
   directory mask = 0775
   force group = nas

# Borg backup repository (read-only via SMB if needed for browsing only)
# Borg clients should connect via SSH, not this share
[borg]
   comment = Borg Backup Repositories
   path = /pool/borg
   valid users = scott
   read only = yes
   browsable = yes
