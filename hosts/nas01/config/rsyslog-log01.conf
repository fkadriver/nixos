# Forward all syslog messages to log01 via TCP with disk-assisted queue.
# Deployed by hosts/nas01/apply.sh to /etc/rsyslog.d/50-log01-forward.conf

action(type="omfwd"
  target="log01.warthog-royal.ts.net"
  port="514"
  protocol="tcp"
  queue.type="LinkedList"
  queue.filename="log01fwd"
  queue.maxdiskspace="500m"
  queue.saveonshutdown="on"
  action.resumeRetryCount="-1"
  action.resumeInterval="30")
